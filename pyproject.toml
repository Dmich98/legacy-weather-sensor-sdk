[project]
name = "weather-sensor-sdk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
omit = ["test_*.py", "tests/*", "mocks/*", "__init__.py"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"
